[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-agent-mvp"
version = "0.1.0"
description = "Local enterprise document generation MVP"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "python-pptx>=1.0.0",
  "python-docx>=1.1.2",
  "fastapi>=0.112",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
  "websockets>=12.0",
  "markdown-it-py>=3.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=7.0",
]
optional = [
  "openai>=1.40",
  "langgraph>=0.2.0",
  "streamlit>=1.36",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["doc_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
